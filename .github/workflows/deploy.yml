name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Include XLSX files in published folder
        run: |
          mkdir -p "01-LLM/src/Data"
          cp "01-LLM/Miscellaneous/Fontes/Cross-Country Alzheimer Prevalence Ranking"/*.xlsx "01-LLM/src/Data/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 01-LLM/src

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
